name: "🤖 BugBot - Análise Automática"
on:
    workflow_dispatch:
        inputs:
            jira_issue_key:
                description: "Jira Issue Key (ex: BUGBOTTEST-1)"
                required: true
                type: string
                default: "BUGBOTTEST-1"

concurrency:
    group: bugbot-analysis
    cancel-in-progress: false

jobs:
    analyze:
        runs-on: ubuntu-latest
        environment: github-pages
        env:
            JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
            JIRA_USER: ${{ secrets.JIRA_USER }}
            JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
            CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        steps:
            - name: 📋 Contexto
              run: |
                  echo "::group::📋 Inicializando contexto"
                  ISSUE="${{ github.event.inputs.jira_issue_key }}"
                  echo "## 🤖 BugBot - Resumo da Execução" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Ticket** | \`$ISSUE\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Workflow** | \`${{ github.workflow }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "::notice::Ticket: $ISSUE"
                  echo "::endgroup::"

            - name: 📥 Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: 🛠️ Cache Cursor CLI
              uses: actions/cache@v4
              id: cursor-cache
              with:
                  path: ~/.local
                  key: cursor-cli-${{ runner.os }}-v1

            - name: 🛠️ Setup Cursor CLI
              run: |
                  echo "::group::🛠️ Instalando Cursor CLI"
                  if [ "${{ steps.cursor-cache.outputs.cache-hit }}" != "true" ]; then
                    curl -fsSL https://cursor.com/install | bash
                  else
                    echo "✓ Cache hit - usando instalação em cache"
                  fi
                  echo "$HOME/.local/bin" >> $GITHUB_PATH
                  cursor-agent --version
                  echo "::endgroup::"

            - name: 📋 Fetch Jira Data
              id: jira
              run: |
                  ISSUE="${{ github.event.inputs.jira_issue_key }}"
                  echo "::group::📋 Buscando dados do Jira ($ISSUE)"
                  DATA=$(curl -sf -u "$JIRA_USER:$JIRA_TOKEN" \
                    "${JIRA_BASE_URL}/rest/api/3/issue/$ISSUE")
                  echo "$DATA" | jq -r '.fields.summary' | tee summary.txt
                  echo "::notice::Dados do ticket obtidos com sucesso"
                  echo "::endgroup::"
                  echo "summary<<EOF" >> $GITHUB_OUTPUT
                  cat summary.txt >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT
                  echo "### 📋 Dados do Jira" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Summary do ticket:**" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  cat summary.txt >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY

            - name: 🧠 Cursor Analysis
              run: |
                  ISSUE="${{ github.event.inputs.jira_issue_key }}"
                  SUMMARY=$(cat summary.txt)
                  echo "::group::📝 Montando prompt"
                  {
                    echo 'REGRA CRÍTICA: Sua resposta deve ser EXATAMENTE e APENAS o bloco abaixo. Nada antes. Nada depois. Sem frases como "The analysis has been written", "Here is a summary", "Pronto" ou similares. Idioma: português.'
                    echo ''
                    echo 'Analista Logcomex Laravel.'
                    echo "Ticket: $ISSUE"
                    echo "Summary: $SUMMARY"
                    echo ''
                    echo 'Responda SOMENTE neste formato (copie o cabeçalho e preencha):'
                    echo ''
                    echo '## 🤖 BugBot'
                    echo '**Problema:** [descreva o problema em português]'
                    echo '**Causa:** [descreva a causa raiz em português]'
                  } > prompt.txt
                  echo "::endgroup::"
                  echo "::group::🧠 Executando Cursor Agent (análise em andamento...)"
                  cursor-agent --trust -p "@prompt.txt" --output-format text 2>&1 | tee analysis_raw.md
                  sed -n '/## 🤖 BugBot/,$p' analysis_raw.md | head -50 > analysis.md
                  [ -s analysis.md ] || cp analysis_raw.md analysis.md
                  echo "::notice::Análise concluída"
                  echo "::endgroup::"
                  echo "### 🧠 Análise do Cursor Agent" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Prévia da análise:**" >> $GITHUB_STEP_SUMMARY
                  echo '```markdown' >> $GITHUB_STEP_SUMMARY
                  head -20 analysis.md >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY

            - name: 💬 Post to Jira
              run: |
                  ISSUE="${{ github.event.inputs.jira_issue_key }}"
                  echo "::group::💬 Postando comentário em $ISSUE"
                  jq -n --rawfile c analysis.md '
                    ($c | tostring | split("\n") | map(select(length > 0)) | map({type: "paragraph", content: [{type: "text", text: .}]})) as $paras |
                    {body: {type: "doc", version: 1, content: $paras}}
                  ' > comment.json
                  curl -sf -u "$JIRA_USER:$JIRA_TOKEN" \
                    -X POST "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE}/comment" \
                    -H "Content-Type: application/json" \
                    -d @comment.json > /dev/null
                  echo "::notice::Comentário postado com sucesso"
                  echo "::endgroup::"
                  echo "### 💬 Comentário no Jira" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "✅ **Comentário postado com sucesso** em \`$ISSUE\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "---" >> $GITHUB_STEP_SUMMARY
                  echo "**Pipeline concluído:** Jira → GitHub Actions → Cursor Agent → Jira" >> $GITHUB_STEP_SUMMARY