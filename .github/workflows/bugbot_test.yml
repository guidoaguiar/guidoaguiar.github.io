name: "🤖 BugBot - Análise Automática"
on:
    workflow_dispatch:
        inputs:
            jira_issue_key:
                description: "Jira Issue Key (ex: BUGBOTTEST-1)"
                required: true
                type: string
                default: "BUGBOTTEST-1"

jobs:
    analyze:
        runs-on: ubuntu-latest
        environment: github-pages
        env:
            JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
            JIRA_USER: ${{ secrets.JIRA_USER }}
            JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
            CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: 🛠️ Cache Cursor CLI
              uses: actions/cache@v4
              id: cursor-cache
              with:
                  path: ~/.local
                  key: cursor-cli-${{ runner.os }}-v1

            - name: 🛠️ Install Cursor CLI
              if: steps.cursor-cache.outputs.cache-hit != 'true'
              run: curl -fsSL https://cursor.com/install | bash

            - name: 🛠️ Setup PATH
              run: echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: 🛠️ Verify Cursor CLI
              run: cursor-agent --version

            - name: 📋 Fetch Jira Data
              id: jira
              run: |
                  ISSUE="${{ github.event.inputs.jira_issue_key }}"
                  DATA=$(curl -sf -u "$JIRA_USER:$JIRA_TOKEN" \
                    "${JIRA_BASE_URL}/rest/api/3/issue/$ISSUE")
                  echo "$DATA" | jq -r '.fields.summary' | tee summary.txt
                  echo "summary<<EOF" >> $GITHUB_OUTPUT
                  cat summary.txt >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: 🧠 Cursor Analysis
              run: |
                  ISSUE="${{ github.event.inputs.jira_issue_key }}"
                  SUMMARY=$(cat summary.txt)
                  printf 'Analista Logcomex Laravel.\nTicket: %s\nSummary: %s\n\nFORMATO:\n## 🤖 BugBot\n**Problema:** ...\n**Causa:** ...\n' "$ISSUE" "$SUMMARY" > prompt.txt
                  cursor-agent --trust -p "@prompt.txt" --output-format text 2>&1 | tee analysis.md

            - name: 💬 Post to Jira
              run: |
                  ISSUE="${{ github.event.inputs.jira_issue_key }}"
                  jq -n --rawfile c analysis.md \
                    '{body: {type: "doc", version: 1, content: [($c | tostring | split("\n")[] | {type: "paragraph", content: [{type: "text", text: .}]})]}}' \
                    > comment.json
                  curl -sf -u "$JIRA_USER:$JIRA_TOKEN" \
                    -X POST "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE}/comment" \
                    -H "Content-Type: application/json" \
                    -d @comment.json